[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-agents"
version = "0.1.0"
description = "A terminal-first manufacturing decision-support agent system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "openai-agents>=0.2.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
manufacturing-agents = "manufacturing_agents.main:main"
manufacturing-agents-ui = "manufacturing_agents.api.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
